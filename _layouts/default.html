<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <a class="get" href="{{ site.app_link }}">Get the app</a>
  </header>
  <main>{{ content }}</main>
  <footer class="site">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.app_name }} · <a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </footer>
  {% if site.goatcounter != "" %}
  <script data-goatcounter="https://{{ site.goatcounter }}.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  {% endif %}
</body>
</html>
