- q: Is FitnessNoobies free?
  a: Every feature is unlocked free for 5 days. After the trial, core tracking stays free; advanced features need Premium (monthly, yearly or a one-time lifetime purchase). Prices are shown in the App Store in your currency.
- q: Is it on Android?
  a: Not yet. FitnessNoobies is iPhone-only for now; Android is coming later.
- q: I've never been to a gym. Is this for me?
  a: Yes, that's exactly who it's for. The onboarding asks about your goal and activity level, and our guides explain the basics step by step.
- q: Do I need a subscription forever?
  a: No. Besides monthly and yearly plans there's a one-time lifetime purchase.
